<!DOCTYPE html>
<!-- 此代码为刻度航宇编写，复制与逆向属于违法行为。不允许解析我的代码 -->
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }
    .header {
      background: linear-gradient(135deg, #005bff 0%, #0041b8 100%);
      padding: 16px;
      text-align: center;
    }
    .header h1 { font-size: 16px; font-weight: 600; }
    .header p { font-size: 11px; opacity: 0.8; margin-top: 4px; }
    .body { padding: 16px; }
    .setting {
      margin-bottom: 12px;
    }
    .setting label {
      display: block;
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 4px;
    }
    .setting input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #30363d;
      border-radius: 6px;
      background: #161b22;
      color: #e6edf3;
      font-size: 13px;
      outline: none;
    }
    .setting input:focus { border-color: #005bff; }
    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #005bff;
      color: #fff;
      margin-top: 8px;
    }
    .btn-primary:hover { background: #0050e0; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-save {
      background: #238636;
      color: #fff;
      margin-top: 4px;
    }
    .btn-save:hover { background: #2ea043; }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success { display: block; background: #0d2818; color: #3fb950; border: 1px solid #238636; }
    .status.error { display: block; background: #2d1117; color: #f85149; border: 1px solid #da3633; }
    .status.info { display: block; background: #0d1d30; color: #58a6ff; border: 1px solid #1f6feb; }
    .divider {
      border: none;
      border-top: 1px solid #21262d;
      margin: 14px 0;
    }
    .product-preview {
      background: #161b22;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: none;
    }
    .product-preview.show { display: block; }
    .product-preview img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 4px;
      float: left;
      margin-right: 10px;
    }
    .product-preview .title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.3;
      max-height: 3.9em;
      overflow: hidden;
    }
    .product-preview .meta {
      font-size: 11px;
      color: #8b949e;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>OZON 商品采集器</h1>
    <p>一键采集商品数据到后台</p>
  </div>
  <div class="body">
    <!-- 配置区 -->
    <div class="setting">
      <label>后端地址</label>
      <input type="text" id="serverUrl" placeholder="http://localhost:3000">
    </div>
    <div class="setting">
      <label>API Key</label>
      <input type="text" id="apiKey" placeholder="ozon_xxxxxx">
    </div>
    <button class="btn btn-save" id="saveBtn">保存设置</button>

    <hr class="divider">

    <!-- 商品预览 -->
    <div class="product-preview" id="preview">
      <img id="previewImg" src="">
      <div class="title" id="previewTitle"></div>
      <div class="meta" id="previewMeta"></div>
      <div style="clear:both"></div>
    </div>

    <!-- 采集按钮 -->
    <button class="btn btn-primary" id="collectBtn" disabled>采集当前商品</button>
    <div class="status" id="statusMsg"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
