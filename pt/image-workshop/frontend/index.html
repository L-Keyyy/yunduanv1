        item.zoom = item.zoom || 1
        item.engine = data.engine || ''
        item.status = 'done'
      } catch (error) {
        item.status = 'error'
        item.error = error instanceof Error ? error.message : String(error)
      } finally {
        item.processing = false
      }
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms))
    }

    async function refreshChatgptStatus() {
      if (!chatgptStatus) return
      const mode = chatgptBrowserMode?.value || 'visible'
      try {
        const response = await fetch(`/chatgpt/status?browser_mode=${encodeURIComponent(mode)}`)
        const data = await response.json()
        if (!response.ok) throw new Error(data.detail || '检测失败')
        const label = mode === 'hidden' ? '隐藏浏览器' : '9222 Chrome'
        if (!data.browser_connected) {
          chatgptStatus.textContent = `网页版 GPT：${data.detail || `${label} 未连接`}`
        } else if (data.chatgpt_tab) {
          chatgptStatus.textContent = `网页版 GPT：${label} 已连接，ChatGPT 已打开`
        } else {
          chatgptStatus.textContent = `网页版 GPT：${label} 已连接，未打开 ChatGPT`
        }
      } catch (error) {
        chatgptStatus.textContent = `网页版 GPT：${error instanceof Error ? error.message : '无法检测'}`
      }
    }

    async function openChatgpt() {
      if (!chatgptStatus) return
      const mode = chatgptBrowserMode?.value || 'visible'
      const label = mode === 'hidden' ? '隐藏浏览器' : '9222 Chrome'
      chatgptStatus.textContent = `网页版 GPT：正在打开 ${label} ChatGPT`
      try {
        const response = await fetch(`/chatgpt/open?browser_mode=${encodeURIComponent(mode)}`, { method: 'POST' })
        const data = await response.json()
        if (!response.ok) throw new Error(data.detail || '打开失败')
        chatgptStatus.textContent = mode === 'hidden'
          ? '网页版 GPT：隐藏浏览器已后台打开 ChatGPT'
          : '网页版 GPT：已在 9222 Chrome 打开 ChatGPT，请确认已登录'
      } catch (error) {
        chatgptStatus.textContent = `网页版 GPT：${error instanceof Error ? error.message : '打开失败'}`
      }
    }

    async function processAllWithChatGPT() {
      const prompt = chatgptPrompt?.value.trim()
      if (!state.images.length || !prompt) return
      state.processing = true
      updateControls()
      for (const item of state.images) {
        await processItemWithChatGPT(item, prompt)
        render()
      }
      state.processing = false
      render()
      refreshChatgptStatus()
    }

    async function processItemWithChatGPT(item, prompt) {
      item.processing = true
      item.status = 'idle'
      item.error = ''
      item.gptStage = '提交网页版 GPT'
      item.regions = []
      item.layers = []
      item.shapes = []
      item.selectedLayerId = ''
      item.selectedShapeId = ''
      item.editingLayerId = ''
      item.engine = 'chatgpt-web'
      item.chatgptText = ''
      releaseGeneratedUrls(item)
      render()

      const payload = new FormData()
      payload.append('file', item.file)
      payload.append('prompt', prompt)
      payload.append('browser_mode', chatgptBrowserMode?.value || 'visible')

      try {
        const response = await fetch('/chatgpt/jobs', {
          method: 'POST',
          body: payload,
        })
        const created = await response.json()
        if (!response.ok) throw new Error(created.detail || '提交失败')

        let job = created
        while (job.status !== 'done' && job.status !== 'error') {
          item.gptStage = job.stage || '等待网页 GPT'
          render()
          await sleep(2000)
          const poll = await fetch(`/chatgpt/jobs/${encodeURIComponent(job.id)}`)
          job = await poll.json()
          if (!poll.ok) throw new Error(job.detail || '读取任务失败')
        }

        if (job.status === 'error') throw new Error(job.error || '网页版 GPT 处理失败')
        if (!job.result_image) throw new Error('网页版 GPT 没有返回图片')

        item.resultUrl = dataUrlToObjectUrl(job.result_image)
        item.backgroundUrl = ''
        item.regions = []
        item.layers = []
        item.shapes = []
        item.selectedLayerId = ''
        item.selectedShapeId = ''
        item.editingLayerId = ''
        item.gptStage = ''
        item.chatgptText = job.result_text || ''
        item.engine = 'chatgpt-web'
        item.status = 'done'
      } catch (error) {
        item.status = 'error'
        item.error = error instanceof Error ? error.message : String(error)
        item.gptStage = ''
      } finally {
        item.processing = false
      }
    }

    function createLayerFromRegion(item, region, index) {
      const rawX = Number(region.x || 0)
      const rawY = Number(region.y || 0)
      const rawWidth = Number(region.width || item.width * 0.4)
      const rawHeight = Number(region.height || item.height * 0.08)
      const expanded = initialLayerBounds(item, rawX, rawY, rawWidth, rawHeight, region.translatedText || region.text || '')
      const x = expanded.x
      const y = expanded.y
      const width = expanded.width
      const height = expanded.height
      const lowerBand = y + height > item.height * 0.82
      const text = region.translatedText || region.text || ''
      const fontFamily = chooseInitialFont(region, width, height)
      const align = chooseInitialAlign(item, x, width)
      const fontSize = fitInitialFontSize(text, width, height, fontFamily, region, item)
      return {
        id: `${item.id}-layer-${index}-${createId()}`,
        text,
        x,
        y,
        width,
        height,
        fontSize,
        color: lowerBand ? '#e8c179' : '#202631',
        fontFamily,
        fontWeight: 700,
        fontStyle: 'normal',
        textDecoration: 'none',
        align,
      }
    }

    function createShapeFromRegion(item, region, index) {
      const rawX = Number(region.x || 0)
      const rawY = Number(region.y || 0)
      const rawWidth = Number(region.width || item.width * 0.4)
      const rawHeight = Number(region.height || item.height * 0.08)
      const expanded = initialLayerBounds(item, rawX, rawY, rawWidth, rawHeight, region.translatedText || region.text || '')
      const shape = chooseInitialShape(region, expanded.width, expanded.height)
      if (shape.type === 'none') return null
      return {
        id: `${item.id}-shape-${index}-${createId()}`,
        type: shape.type,
        x: expanded.x,
        y: expanded.y,
        width: expanded.width,
        height: expanded.height,
        color: shape.color,
        opacity: shape.opacity,
      }
    }

    function initialLayerBounds(item, x, y, width, height, text) {
      const textLength = String(text || '').replace(/\s+/g, '').length
      const expandX = clampNumber(Math.min(width * 0.12, item.width * 0.018 + textLength * 0.45), 4, item.width * 0.075)
      const expandY = clampNumber(height * 0.18, 2, item.height * 0.018)
      const leftExpand = Math.min(expandX * 0.38, Math.max(0, x - item.width * 0.025))
      const rightExpand = expandX * 1.25
      let nextX = clampNumber(x - leftExpand, 0, item.width - 1)
      let nextY = clampNumber(y - expandY, 0, item.height - 1)
      let nextWidth = clampNumber(width + leftExpand + rightExpand, 24, item.width - nextX)
      let nextHeight = clampNumber(height + expandY * 2, 20, item.height - nextY)

      const isLargeTitle = height > item.height * 0.035 || width > item.width * 0.32
      if (isLargeTitle) {
        nextWidth = clampNumber(Math.max(nextWidth, width * 1.08), 40, item.width - nextX)
        nextHeight = clampNumber(Math.max(nextHeight, height * 1.18), 24, item.height - nextY)
      }

      return { x: nextX, y: nextY, width: nextWidth, height: nextHeight }
    }

    function chooseInitialFont(region, width, height) {
      const text = `${region.text || ''} ${region.translatedText || ''}`
      if (height > 54 || width > 420) return "'Trebuchet MS', Arial, sans-serif"
      if (/定制|香片|мойка|ароматизаторы/i.test(text)) return 'Verdana, Arial, sans-serif'
      return 'Arial, sans-serif'
    }

    function chooseInitialAlign(item, x, width) {
      if (width > item.width * 0.28) return 'center'
      if (x > item.width * 0.58) return 'right'
      return 'left'
    }

    function fitInitialFontSize(text, width, height, fontFamily, region, item) {
      const probe = document.createElement('canvas')
      const context = probe.getContext('2d')
      const maxSize = Math.max(8, Math.round(Math.min(height * 0.52, width * 0.082, item.width * 0.042)))
      const minSize = 7
      const maxLines = height < item.height * 0.045 ? 2 : height < item.height * 0.085 ? 3 : 4
      for (let size = maxSize; size >= minSize; size -= 1) {
        context.font = `700 ${size}px ${fontFamily}`
        const lines = wrapCanvasText(context, text, width * 0.96)
        const lineHeight = size * 1.18
        const longest = Math.max(...lines.map((line) => context.measureText(line).width), 0)
        if (lines.length <= maxLines && longest <= width * 0.98 && lines.length * lineHeight <= height * 0.92) {
          return size
        }
      }
      return minSize
    }

    function chooseInitialShape(region, width, height) {
      const source = String(region.text || '')
      const ratio = width / Math.max(1, height)
      if (/支持LOGO|自由定制/.test(source) && ratio > 4) {
        return { type: 'pill', color: '#ead7bd', opacity: 0.72 }
      }
      if (/支持\s*定制/.test(source)) {
        return { type: 'circle', color: '#a96d3e', opacity: 0.86 }
      }
      return { type: 'none', color: '#ead7bd', opacity: 0.72 }
    }

    async function downloadImage(item) {
      if (!item.backgroundUrl && !item.resultUrl) return
      const href = item.backgroundUrl ? await composeImage(item) : item.resultUrl
      const link = document.createElement('a')
      link.href = href
      link.download = `${item.name.replace(/\.[^.]+$/, '') || 'translated'}-${language.value}.png`
      link.click()
    }

    async function downloadAll() {
      for (const item of state.images.filter((entry) => entry.backgroundUrl || entry.resultUrl)) {
        await downloadImage(item)
      }
    }

    async function composeImage(item) {
      const image = await loadImage(item.backgroundUrl || item.resultUrl)
      const canvas = document.createElement('canvas')
      canvas.width = item.width
      canvas.height = item.height
      const context = canvas.getContext('2d')
      context.drawImage(image, 0, 0, item.width, item.height)

      for (const shape of item.shapes || []) {
        drawShape(context, shape)
      }
      for (const layer of item.layers) {
        drawLayer(context, layer)
      }
      return canvas.toDataURL('image/png')
    }

    function drawShape(context, shape) {
      context.save()
      context.fillStyle = hexToRgba(shape.color, shape.opacity)
      const radius =
        shape.type === 'pill' || shape.type === 'circle' || shape.type === 'line'
          ? Math.min(shape.width, shape.height) / 2
          : shape.type === 'round'
            ? Math.min(shape.width, shape.height) * 0.18
            : 2
      roundedRect(context, shape.x, shape.y, shape.width, shape.height, radius)
      context.fill()
      context.restore()
    }

    function roundedRect(context, x, y, width, height, radius) {
      const safeRadius = Math.min(radius, width / 2, height / 2)
      context.beginPath()
      context.moveTo(x + safeRadius, y)
      context.lineTo(x + width - safeRadius, y)
      context.quadraticCurveTo(x + width, y, x + width, y + safeRadius)
      context.lineTo(x + width, y + height - safeRadius)
      context.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height)
      context.lineTo(x + safeRadius, y + height)
      context.quadraticCurveTo(x, y + height, x, y + height - safeRadius)
      context.lineTo(x, y + safeRadius)
      context.quadraticCurveTo(x, y, x + safeRadius, y)
      context.closePath()
    }

    function drawLayer(context, layer) {
      context.save()
      context.font = `${layer.fontStyle || 'normal'} ${layer.fontWeight} ${layer.fontSize}px ${layer.fontFamily}`
      context.fillStyle = layer.color
      context.textBaseline = 'top'
      context.textAlign = layer.align
      context.shadowColor = 'rgba(255,255,255,0.55)'
      context.shadowBlur = Math.max(1, layer.fontSize * 0.06)

      const lines = wrapCanvasText(context, layer.text, layer.width)
      const lineHeight = layer.fontSize * 1.18
      const startX = layer.align === 'center' ? layer.x + layer.width / 2 : layer.align === 'right' ? layer.x + layer.width : layer.x
      lines.forEach((line, index) => {
        const y = layer.y + index * lineHeight
        context.fillText(line, startX, y)
        if (layer.textDecoration === 'underline') {
          const width = context.measureText(line).width
          const underlineY = y + layer.fontSize * 1.04
          const lineStartX = layer.align === 'center'
            ? startX - width / 2
            : layer.align === 'right'
              ? startX - width
              : startX
          context.save()
          context.shadowColor = 'transparent'
          context.lineWidth = Math.max(1, layer.fontSize * 0.07)
          context.beginPath()
          context.moveTo(lineStartX, underlineY)
          context.lineTo(lineStartX + width, underlineY)
          context.strokeStyle = layer.color
          context.stroke()
          context.restore()
        }
      })
      context.restore()
    }

    function wrapCanvasText(context, text, maxWidth) {
      const lines = []
      const paragraphs = String(text || '').split('\n').map((part) => part.trim()).filter(Boolean)
      for (const paragraph of paragraphs) {
        const words = paragraph.split(/\s+/)
        let current = ''
        for (const word of words) {
          const candidate = `${current} ${word}`.trim()
          if (!current || context.measureText(candidate).width <= maxWidth) {
            current = candidate
          } else {
            lines.push(current)
            current = word
          }
        }
        if (current) lines.push(current)
      }
      return lines.length ? lines : ['']
    }

    function percent(value, total) {
      return clampNumber((value / Math.max(1, total)) * 100, 0, 100).toFixed(4)
    }

    function round(value) {
      return Math.round(Number(value) || 0)
    }

    function clampNumber(value, min, max) {
      const safe = Number.isFinite(value) ? value : min
      return Math.min(Math.max(safe, min), Math.max(min, max))
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;')
    }

    async function checkServer() {
      try {
        const response = await fetch('/health')
        if (!response.ok) throw new Error('offline')
        serverStatus.textContent = '服务已开启'
      } catch {
        serverStatus.textContent = '服务未连接'
      }
    }

    fileInput.addEventListener('change', (event) => addFiles(event.target.files || []))
    processButton.addEventListener('click', processAll)
    openChatgptButton.addEventListener('click', openChatgpt)
    chatgptButton.addEventListener('click', processAllWithChatGPT)
    chatgptPrompt.addEventListener('input', updateControls)
    chatgptBrowserMode.addEventListener('change', refreshChatgptStatus)
    downloadAllButton.addEventListener('click', downloadAll)
    language.addEventListener('change', () => {
      for (const item of state.images) {
        releaseGeneratedUrls(item)
        item.status = 'idle'
        item.regions = []
        item.layers = []
        item.shapes = []
        item.selectedLayerId = ''
        item.selectedShapeId = ''
        item.editingLayerId = ''
        item.engine = ''
        item.chatgptText = ''
        item.gptStage = ''
        item.error = ''
      }
      render()
    })

    translationMode.addEventListener('change', () => {
      for (const item of state.images) {
        releaseGeneratedUrls(item)
        item.status = 'idle'
        item.regions = []
        item.layers = []
        item.shapes = []
        item.selectedLayerId = ''
        item.selectedShapeId = ''
        item.editingLayerId = ''
        item.engine = ''
        item.chatgptText = ''
        item.gptStage = ''
        item.error = ''
      }
      render()
    })

    for (const eventName of ['dragenter', 'dragover']) {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault()
        dropZone.classList.add('dragging')
      })
    }

    for (const eventName of ['dragleave', 'drop']) {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault()
        dropZone.classList.remove('dragging')
      })
    }

    dropZone.addEventListener('drop', (event) => addFiles(event.dataTransfer.files || []))

    checkServer()
    refreshChatgptStatus()
    setInterval(refreshChatgptStatus, 15000)
    render()
  </script>
</body>
</html>
